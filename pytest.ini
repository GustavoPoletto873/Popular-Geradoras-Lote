[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
pythonpath = .
testpaths = tests
markers =
    browser: testes que abrem o navegador (Playwright); só rodam com --run-browser
    excel: testes que abrem o Excel real via COM; só rodam com --run-excel
    postgres: testes que exigem Postgres (DB_ENGINE=postgres); pulados no SQLite
